[package]
name = "liara-launch"
version = "0.1.0"
description = "Your project, live on Liara"
authors = ["Liara Launch contributors"]
edition = "2021"

[[bin]]
name = "liara-launch"
path = "src/main.rs"
required-features = ["desktop"]

[lib]
name = "liara_launch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:keyring"]

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"], optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
regex = "1"
ignore = "0.4"
walkdir = "2"
tar = "0.4"
flate2 = "1"
dotenvy = "0.15"
url = "2"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
